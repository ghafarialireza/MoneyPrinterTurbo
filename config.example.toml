# MoneyPrinterTurbo configuration example.
# The app copies this file to config.toml on first run. Keep API keys and other
# credentials in config.toml; do not commit your local config.toml.

# =============================================================================
# API Service / API 服务
# =============================================================================
# Log level: DEBUG, INFO, WARNING, or ERROR.
log_level = "DEBUG"
# Use 127.0.0.1 for local-only access. 0.0.0.0 listens on all network interfaces.
listen_host = "0.0.0.0"
listen_port = 8080

[app]

# -----------------------------------------------------------------------------
# General / 通用设置
# -----------------------------------------------------------------------------

# Hide the basic configuration panel in the WebUI.
# 是否隐藏 WebUI 基础配置面板。
hide_config = false

# Script generation backend. "local" keeps the existing LLM workflow.
# "loomloom" uses a configured LoomLoom Market SkillBot to return multiple
# independently generated script candidates. The WebUI integration is optional.
script_generation_backend = "local"

# LoomLoom Public API settings. The WebUI supports the public MoneyPrinterTurbo
# SkillBot below out of the box. Configure the key in the WebUI or a private
# config.toml, and never commit a real key. The fixed SkillBot accepts subject,
# requirements, and candidateIndex for each row
# and returns inline JSON {script, videoTerms} on port "output".
loomloom_base_url = "https://loomloom.shengsuanyun.com/loom/v1"
loomloom_api_token = ""
loomloom_request_timeout_seconds = 30
loomloom_poll_interval_seconds = 2
loomloom_run_timeout_seconds = 600
loomloom_video_run_timeout_seconds = 1800

# Edge TTS inactivity timeout. It resets whenever valid audio/boundary data arrives.
# Edge TTS 无有效数据的停滞超时；收到有效数据后重新计时。0 表示禁用。
edge_tts_timeout = 30
# Independent overall safety ceiling for one complete stream. 0 disables it.
# 单次完整流的独立总安全上限；0 表示禁用。
edge_tts_overall_timeout = 300

# Verify TLS certificates for external APIs and material downloads.
# 默认应保持开启；仅在可信代理或自签名证书环境中临时关闭。
tls_verify = true

# -----------------------------------------------------------------------------
# Video Materials / 视频素材
# -----------------------------------------------------------------------------

# Available values: "pinterest", "pexels", "pixabay", "loomloom", "local".
# "pinterest" is the default because it needs no credential: it reads Pinterest's
# public video-pin search, so there is no key to register and no quota to spend.
# The trade-off is that its clips are user-pinned reposts rather than licensed
# stock, so they are not cleared for reuse and are more likely to carry
# watermarks or burnt-in captions. Select "pexels" if a licensed source matters
# for how the finished video will be published.
# "loomloom" is a paid Shengsuan Cloud source and requires explicit
# confirmation in the WebUI before each generation request.
video_source = "pinterest"

# API key lists support key rotation. Use straight ASCII double quotes and
# separate multiple keys with commas, for example: ["key-1", "key-2"].
# Key 必须使用英文半角双引号，多个 Key 使用英文逗号分隔。
# Pinterest has no entry here on purpose — it takes no key.

# Register at https://www.pexels.com/api/
pexels_api_keys = []

# Register at https://pixabay.com/api/docs/
pixabay_api_keys = []

# Optional TwelveLabs integration for smart Pexels candidate and segment selection.
# Install the optional dependency with: uv sync --extra twelvelabs
# Create an API key at https://playground.twelvelabs.io/
twelvelabs_api_keys = []
# Reorder search terms using Marengo before downloading materials. This option
# is ignored when match_materials_to_script is enabled.
twelvelabs_rerank_terms = false
# In ordered Pexels mode, score candidates against each exact narration slot with
# Pegasus 1.5, select the globally best passing candidate, then segment the winner.
twelvelabs_clip_qa = false
# Evaluate complete batches of up to 5 concurrently; never inspect more than 15
# candidates for one visual slot.
twelvelabs_candidate_batch_size = 5
twelvelabs_max_candidates_per_slot = 15
twelvelabs_candidate_concurrency = 5
# A candidate is accepted only when all semantic/action/visibility hard gates pass
# and the application-owned weighted score reaches this threshold.
twelvelabs_clip_qa_min_score = 0.70
twelvelabs_strong_early_stop_score = 0.90
# Prefer shorter stock clips first without discarding longer candidates.
twelvelabs_preferred_max_source_duration = 30.0
# Quality-first behavior: if Pegasus times out or returns malformed output, reject
# the current slot instead of silently using an unverified or zero-start clip.
twelvelabs_clip_qa_fail_closed = true
# Marengo remains configurable for the separate legacy search-term reranker.
# twelvelabs_marengo_model = "marengo3.0"

# Match search terms and downloaded materials to the script narrative order.
# 默认关闭，开启后会减少随机性，使素材顺序更贴近文案结构。
match_materials_to_script = false

# Smart visual matching, per beat, when a provider returns nothing usable:
# first try the alternative phrasings the script stage generated for that beat on
# the same provider, then move on to the next searchable provider
# (pinterest -> pexels -> pixabay; the selected provider always goes first, and
# providers that need a key but have none are skipped).
# Set the cascade to false to stay on the selected provider only, and set the
# variant count to 1 to spend exactly one query per provider. Each extra phrasing
# costs one stock search plus one more round of candidate analysis.
smart_material_provider_cascade = true
smart_material_max_query_variants = 3
# When no phrasing on any provider could fill a beat, describe the same narration
# a second way and search once more before failing the video. The alternative must
# quote the beat's own spoken text, so the video still shows what it says.
smart_material_requirement_rewrite = true
# The one exception: the shot that opens the video. A rewrite may change what is
# depicted, not only how findable it is, and in a vertical feed the frame at t=0 is
# the thumbnail — the video is judged on it before the first word is audible. So the
# opening shot keeps its literal requirement and fails as unfillable instead, which
# is visible and fixable. Set true if you would rather have any opening shot than
# none.
smart_material_rewrite_opening_shot = false
# Spend ceiling, in analyzed candidates, for one selection round of one beat.
# Only a successful round stops early, so a beat that can be filled never comes
# near this; a beat nothing can satisfy would otherwise spend the full
# twelvelabs_max_candidates_per_slot on every phrasing of every provider. Leave it
# unset to track the per-search cap (5x), or set 0 to remove the ceiling. A beat
# runs at most two rounds — its planned requirement and the rewritten one — so its
# worst case is twice this number.
# smart_material_max_analyzed_candidates_per_round = 75
# Last resort before the video fails: let a neighbouring shot absorb the window of
# a beat nothing could fill. The neighbour's clip has already been approved for the
# adjacent stretch of the same narration, so it is simply cut wider — no extra
# analysis unless the clip is too short to cover both. The narration timing never
# moves; only a cut is lost. Leave it unset to allow a third of the beats, or set 0
# to fail the video on the first unfillable beat instead. A value above a third is
# honored as written: it trades visual variety for finishing the video.
# smart_material_max_merged_beats = 4
# Whether that rescue may cross a semantic group boundary. A shot of the open beat's
# own group is always preferred, but most spans now produce a single beat, so a beat
# that fails is usually the only shot of its group and has no such sibling — which
# used to fail the whole video. With this on, the shot beside it takes the window
# instead, and the beat is recorded with the cross-group duration policy so the
# weaker rescue stays visible. Set false to fail the video in that case.
# smart_material_cross_group_merge = true
# Spend ceiling, in analyzed candidates, for one whole video. The per-round number
# above bounds one beat; this bounds the run, which matters because a beat that
# cannot be filled no longer stops the video — it falls down the recovery ladder,
# so several hard beats can each spend two full rounds. This ceiling is checked
# only where a run is about to buy recovery (another phrasing, another provider,
# the rewritten requirement, a fresh search for a merged window), never where a
# beat takes its first look, so it cuts cost and not quality. Once it is spent,
# every beat still gets one search and the free rungs of the ladder still run.
# Leave it unset for two full candidate pages per beat (2 x beats x
# twelvelabs_max_candidates_per_slot, e.g. 420 for 14 beats at 15 candidates), or
# set 0 to remove the ceiling. A healthy video settles in its first batch per beat
# and spends well under a quarter of the default, so lowering it to about one page
# per beat costs a damaged video its rewrites and buys back the worst case.
# smart_material_max_analyzed_candidates_per_video = 420

# Optional Sonilo video-matched original background music.
# Create a key at https://platform.sonilo.com/dashboard. The WebUI can also save
# this value, or you can set the SONILO_API_KEY environment variable instead.
sonilo_api_key = ""
sonilo_base_url = "https://api.sonilo.com"
# 单次生成流连续无数据时的最长等待秒数；它不是整个请求的总耗时上限。
sonilo_timeout = 600

# -----------------------------------------------------------------------------
# LLM Providers / 大模型提供商
# -----------------------------------------------------------------------------

# Provider definitions, default models, and default Base URLs are maintained in
# app/models/llm_provider.py. Leave model_name and base_url empty to follow the
# Registry defaults; only set them when you need an explicit override.
llm_provider = "moonshot"

# Output-token ceiling for providers whose SDK requires an explicit limit
# (currently Gemini). Structured requests such as semantic visual grouping and
# visual requirement decomposition return multi-object JSON; a ceiling that is
# too low truncates the response mid-object and the whole payload is discarded.
# 0 or unset uses the built-in default.
# 仅对必须显式声明上限的 Provider 生效；上限过低会截断结构化 JSON 响应。
llm_max_output_tokens = 0

